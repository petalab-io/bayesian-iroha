name: Quarto Publish

on:
  push:
    branches: [ main ]
    # ここで対象ファイルを限定します
    paths:
      - '_quarto.yml'
      # もし「ノートブックを追加した時」も自動更新したい場合は以下も追記
      # - 'notebooks/**'
      # - 'index.qmd'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}